name: Build and Release Beta APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Code Static Analysis
        run: flutter analyze lib/

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/bahonar-nut-beta.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bahonar-nut-beta-apk
          path: release-output/bahonar-nut-beta.apk

      - name: Create or Update GitHub Beta Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v1.0.0-beta.1"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          fi

          echo "Publishing release for tag: $RELEASE_TAG ..."

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Uploading artifact..."
            gh release upload "$RELEASE_TAG" "release-output/bahonar-nut-beta.apk#bahonar-nut-beta.apk" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "سِلفیار نسخه آزمایشی بتا ($RELEASE_TAG)" \
              -F .github/RELEASE_NOTES_BETA.md \
              --prerelease
          else
            echo "Creating new release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" "release-output/bahonar-nut-beta.apk#bahonar-nut-beta.apk" \
              --title "سِلفیار نسخه آزمایشی بتا ($RELEASE_TAG)" \
              -F .github/RELEASE_NOTES_BETA.md \
              --prerelease
          fi
