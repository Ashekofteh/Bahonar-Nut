name: Build and Release Beta APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Code Static Analysis
        run: flutter analyze lib/

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/bahonar-nut-beta.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bahonar-nut-beta-apk
          path: release-output/bahonar-nut-beta.apk

      - name: Create or Update GitHub Beta Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="v1.0.0-beta.${{ github.run_number }}"
          fi

          echo "Publishing release $RELEASE_TAG ..."

          gh release create "$RELEASE_TAG" "release-output/bahonar-nut-beta.apk#Bahonar Nut Android App (Beta)" \
            --title "باهنر نُت نسخه آزمایشی بتا ($RELEASE_TAG)" \
            --notes "## باهنر نُت — اپلیکیشن رزرو و شکار غذای دانشگاه شهید باهنر کرمان (نسخه بتا)

### ✨ ویژگی‌های نسخه بتا:
- 👥 **پشتیبانی کامل از سلف‌های خواهران و برادران:** سازگاری داینامیک با سلف‌های مرکزی برادران/خواهران و فنی برادران/خواهران بدون هیچ‌گونه باگ یا وابستگی به متن فارسی.
- 💳 **تشخیص هوشمند کسری موجودی و هدایت خودکار:** محاسبه دقیق کسری موجودی در رزرو تکی یا چندگانه و هدایت مستقیم کاربر به درگاه پرداخت با مبلغ پیش‌فرض بر مبنای تومان.
- 🔄 **رزرو خودکار پس از پرداخت موفق:** رزرو خودکار وعده‌های انتخاب‌شده به محض اتمام تراکنش پرداخت اینترنتی.
- 🍱 **سبد غذایی ثانویه و فروش غذا (`FoodBasketSale`):** امکان عرضه وعده‌های رزروشده جهت فروش در سبد غذایی دانشجویان.
- 🎯 **سامانه هوشمند و کم‌مصرف شکار غذا (Food Hunt):** اولویت‌بندی غذاها و سلف‌ها، شکار هوشمند در پنجره‌های توزیع با نظارت بر بودجه ترافیکی و بدون مصرف باتری در ساعات غیر اوج.
- 🧾 **دریافت فیش فراموشی موقت کارت (`ForgotReceipt`):** دریافت و کپی سریع کد فیش فراموشی جهت تحویل به سلف.
- ⚡ **بهینه‌سازی حداکثری مصرف رم (RAM) و باتری:** هرس خودکار کش محلی، کش سراسری تمپلیت‌های کپچا و مدیریت اتصالات شبکه و چرخه حیات اندروید." \
            --prerelease
