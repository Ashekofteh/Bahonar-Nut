name: Build and Release Multi-Platform (Android, Windows, macOS, Linux, iOS)

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Code Static Analysis
        run: flutter analyze --no-fatal-infos lib/

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/selfiyar-beta.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfiyar-android-apk
          path: release-output/selfiyar-beta.apk

  build-windows:
    name: Build Windows Desktop (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          Copy-Item "$releaseDir\bahonar_nut.exe" "$releaseDir\Selfiyar.exe" -Force
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "selfiyar-windows-x64.zip" -Force

      - name: Upload Windows ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfiyar-windows-zip
          path: selfiyar-windows-x64.zip

  build-macos:
    name: Build macOS Desktop
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS Application Bundle
        run: |
          cd build/macos/Build/Products/Release
          if [ -d "Selfiyar.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent Selfiyar.app ../../../../../selfiyar-macos.zip
          elif [ -d "bahonar_nut.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent bahonar_nut.app ../../../../../selfiyar-macos.zip
          fi
          cd ../../../../..

      - name: Upload macOS ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfiyar-macos-zip
          path: selfiyar-macos.zip

  build-linux:
    name: Build Linux Desktop (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop Support
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Linux Relocatable Tarball (.tar.gz)
        run: |
          BUNDLE_DIR="build/linux/x64/release/bundle"
          if [ -f "$BUNDLE_DIR/bahonar_nut" ] && [ ! -f "$BUNDLE_DIR/Selfiyar" ]; then
            cp "$BUNDLE_DIR/bahonar_nut" "$BUNDLE_DIR/Selfiyar"
          fi
          echo "[Desktop Entry]" > "$BUNDLE_DIR/Selfiyar.desktop"
          echo "Name=سِلفیار" >> "$BUNDLE_DIR/Selfiyar.desktop"
          echo "GenericName=Selfiyar" >> "$BUNDLE_DIR/Selfiyar.desktop"
          echo "Comment=Smart Dining Assistant for Shahid Bahonar University" >> "$BUNDLE_DIR/Selfiyar.desktop"
          echo "Exec=Selfiyar" >> "$BUNDLE_DIR/Selfiyar.desktop"
          echo "Icon=data/flutter_assets/assets/images/app_logo.png" >> "$BUNDLE_DIR/Selfiyar.desktop"
          echo "Terminal=false" >> "$BUNDLE_DIR/Selfiyar.desktop"
          echo "Type=Application" >> "$BUNDLE_DIR/Selfiyar.desktop"
          echo "Categories=Utility;" >> "$BUNDLE_DIR/Selfiyar.desktop"
          chmod +x "$BUNDLE_DIR/Selfiyar" "$BUNDLE_DIR/bahonar_nut"
          tar -czvf selfiyar-linux-x64.tar.gz -C build/linux/x64/release bundle

      - name: Upload Linux TAR.GZ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfiyar-linux-tar
          path: selfiyar-linux-x64.tar.gz

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App Bundle (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Universal iOS IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r selfiyar-ios.ipa Payload
          rm -rf Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfiyar-ios-ipa
          path: selfiyar-ios.ipa

  publish-release:
    name: Publish Multi-Platform Release
    needs: [build-android, build-windows, build-macos, build-linux, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: selfiyar-android-apk
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: selfiyar-windows-zip
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: selfiyar-macos-zip
          path: release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: selfiyar-linux-tar
          path: release-assets

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: selfiyar-ios-ipa
          path: release-assets

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v1.0.0-beta.20"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          fi

          echo "Publishing release for tag: $RELEASE_TAG ..."

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Uploading all platform artifacts..."
            gh release upload "$RELEASE_TAG" \
              "release-assets/selfiyar-beta.apk#selfiyar-beta.apk" \
              "release-assets/selfiyar-windows-x64.zip#selfiyar-windows-x64.zip" \
              "release-assets/selfiyar-macos.zip#selfiyar-macos.zip" \
              "release-assets/selfiyar-linux-x64.tar.gz#selfiyar-linux-x64.tar.gz" \
              "release-assets/selfiyar-ios.ipa#selfiyar-ios.ipa" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "سِلفیار نسخه آزمایشی بتا ($RELEASE_TAG)" \
              -F .github/RELEASE_NOTES_BETA.md \
              --prerelease
          else
            echo "Creating new release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" \
              "release-assets/selfiyar-beta.apk#selfiyar-beta.apk" \
              "release-assets/selfiyar-windows-x64.zip#selfiyar-windows-x64.zip" \
              "release-assets/selfiyar-macos.zip#selfiyar-macos.zip" \
              "release-assets/selfiyar-linux-x64.tar.gz#selfiyar-linux-x64.tar.gz" \
              "release-assets/selfiyar-ios.ipa#selfiyar-ios.ipa" \
              --title "سِلفیار نسخه آزمایشی بتا ($RELEASE_TAG)" \
              -F .github/RELEASE_NOTES_BETA.md \
              --prerelease
          fi
