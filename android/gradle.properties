org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Keep Gradle's build output on D: — C: runs near-full on this machine and hit
# 0 bytes free during the first build attempt. D: has headroom.
org.gradle.project.buildDir=D:/Bahonar-Nut/.gradle-build
org.gradle.caching=true
org.gradle.parallel=true
# Kotlin's incremental compilation caches fail to close on Windows: the
# `.tab` files are memory-mapped and locked, and the build dies with
# "Could not close incremental caches". It surfaced when the webview
# plugin's module was added, but it is a platform fault, not a plugin one.
# Compiling the Kotlin sources from scratch takes ~30s here, which is a fair
# price for a build that completes.
kotlin.incremental=false